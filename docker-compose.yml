# Local Postgres + pgvector for clone-and-run. No cloud account needed.
#
#   docker compose up -d
#   DATABASE_URL_INGEST=postgresql://postgres:postgres@localhost:5432/knowledge tieline migrate
#   tieline init /path/to/product-repository
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/knowledge tieline serve
#
# The pgvector/pgvector image is stock Postgres with the vector extension
# preinstalled, so `create extension vector` in migration 0001 just works.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
