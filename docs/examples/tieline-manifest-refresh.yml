# For a consumer repository with Tieline pinned in its npm lockfile.
# Pair with manifest_mode: post_merge and the pre-merge checks documented below.
name: Refresh Tieline manifest
on:
  push:
    branches: [main] # Set this to the integration branch, e.g. env/staging.
    paths-ignore:
      - '.tieline/manifest/**'
permissions:
  contents: write
concurrency:
  group: tieline-manifest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish generated manifest for the current integration tip
        env:
          TIELINE_BRANCH: ${{ github.ref_name }}
        run: npx --no-install tieline contract refresh-manifest . --branch "$TIELINE_BRANCH" --json
