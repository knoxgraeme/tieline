name: Tiepoint contract

on:
  pull_request:

jobs:
  semantic-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tiepoint contract validate .
      - run: npx --yes tiepoint check --base origin/${{ github.base_ref }} .
