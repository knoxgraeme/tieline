<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Section coupling map</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --line-strong:#d6dbe4; --ink:#171b21;
          --muted:#5b6472; --faint:#8a93a3; --field:#fff; --accent:#2f6feb; --accent-ink:#fff;
          --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
          --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1318; --card:#161c24; --line:#242c36; --line-strong:#333c48; --ink:#e7eaef;
    --muted:#9aa3b2; --faint:#6b7484; --field:#0e131a; --accent:#5f9bff; --accent-ink:#0b0f14; }}
  :root[data-theme="light"]{ --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --line-strong:#d6dbe4;
    --ink:#171b21; --muted:#5b6472; --faint:#8a93a3; --field:#fff; --accent:#2f6feb; --accent-ink:#fff; }
  :root[data-theme="dark"]{ --bg:#0f1318; --card:#161c24; --line:#242c36; --line-strong:#333c48;
    --ink:#e7eaef; --muted:#9aa3b2; --faint:#6b7484; --field:#0e131a; --accent:#5f9bff; --accent-ink:#0b0f14; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 var(--sans); color:var(--ink); background:var(--bg); overflow:hidden; }
  #graph { position:fixed; inset:0; width:100vw; height:100vh; display:block; cursor:grab; touch-action:none; }
  #graph:active { cursor:grabbing; }

  .toolbar { position:fixed; top:14px; left:14px; right:14px; z-index:5; display:flex; align-items:center;
             gap:14px; flex-wrap:wrap; padding:10px 14px; background:color-mix(in srgb, var(--card) 88%, transparent);
             border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(6px); }
  .toolbar h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; }
  .toolbar .stats { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .grow { flex:1 1 auto; }
  .ctl { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; white-space:nowrap; }
  .ctl input[type=range] { accent-color:var(--accent); width:130px; }
  #minWeightVal { font-family:var(--mono); color:var(--ink); min-width:34px; }
  button { font:inherit; font-weight:550; cursor:pointer; border:1px solid var(--line-strong);
           background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  #legend { position:fixed; bottom:14px; left:14px; z-index:5; display:flex; gap:14px; flex-wrap:wrap;
            padding:8px 12px; background:color-mix(in srgb, var(--card) 88%, transparent);
            border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(6px);
            color:var(--muted); font-size:12px; }
  .lg { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }

  #hint { position:fixed; bottom:14px; right:14px; z-index:5; color:var(--faint); font-size:11px;
          padding:6px 10px; }

  #tooltip { position:fixed; z-index:10; display:none; max-width:340px; pointer-events:none;
             background:var(--card); border:1px solid var(--line-strong); border-radius:10px;
             padding:9px 11px; box-shadow:0 6px 24px rgba(0,0,0,.18); font-size:12.5px; }
  #tooltip .tt-title { font-weight:600; color:var(--ink); }
  #tooltip .tt-sub { color:var(--faint); font-size:11.5px; margin:1px 0 5px; font-family:var(--mono); }
  #tooltip .tt-row { color:var(--muted); display:flex; align-items:center; gap:6px; }
  #tooltip .tt-line { color:var(--muted); margin-top:3px; word-break:break-word; }
  #tooltip .tt-line b { color:var(--faint); font-weight:600; text-transform:uppercase; font-size:10px;
                        letter-spacing:.04em; margin-right:4px; }

  #empty { position:fixed; inset:0; display:none; place-content:center; text-align:center;
           color:var(--muted); padding:40px; }
</style>
</head>
<body>
<canvas id="graph"></canvas>

<div class="toolbar">
  <h1>Section coupling map</h1>
  <span class="stats" id="stats"></span>
  <span class="grow"></span>
  <span class="ctl">min link
    <input type="range" id="minWeight" />
    <span id="minWeightVal">0.00</span>
  </span>
  <button id="refit">Refit</button>
</div>

<div id="legend"></div>
<div id="hint">drag nodes · scroll to zoom · drag canvas to pan</div>
<div id="tooltip"></div>
<div id="empty"></div>

<script id="graph-data" type="application/json">/*__GRAPH__*/</script>
<script>/*__VIEW__*/</script>
<script>/*__HOST__*/</script>
</body>
</html>
