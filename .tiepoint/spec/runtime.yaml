        - key: RUNTIME-001-AC11
          criterion: Tiepoint initialization must upgrade a workspace created under the earlier tieline name by moving its workspace directory and private profile, replacing recognized tieline MCP entries and project skills, and listing the steps it cannot perform, while other commands must refuse an un-upgraded workspace.
          rationale: A renamed package must not strand existing repositories or let a contract check pass against an empty contract.
          scenarios:
            - given: a repository with a .tieline workspace, a tieline profile, a tieline MCP entry, and a project tieline skill
              when: a maintainer runs tiepoint init
              then: the workspace and profile move to tiepoint locations, the MCP entry and skill are replaced, and remaining manual steps are listed
            - given: the tiepoint skill installation fails
              when: tiepoint init upgrades the repository
              then: the earlier tieline skill must remain installed
            - given: an un-upgraded .tieline workspace
              when: a maintainer runs a contract, check, code, or status command
              then: the command must fail and name the upgrade command
