version: 1
capability:
  key: CONTRACT
  name: Living product contract
  description: Accepted product behavior is strict, reviewable, and measurable beside the implementation.
  aliases:
    - semantic contract
    - living specification
  stories:
    - key: CONTRACT-001
      title: Review accepted behavior with code
      actor: maintainer
      goal: define product behavior in a stable Story and Acceptance Criterion hierarchy
      benefit: intent and implementation change through the same review
      lifecycle: production
      aliases:
        - author accepted behavior
      acceptance_criteria:
        - key: CONTRACT-001-AC1
          criterion: Tieline must reject repository contract documents that violate the accepted Story and Acceptance Criterion schema.
          rationale: Structural failures make semantic impact and synchronization untrustworthy.
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/schema.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/load.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/validate.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/index.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-contract.ts
                framework_hint: custom-script
        - key: CONTRACT-001-AC2
          criterion: Tieline must compile deterministic manifests and report direct-AC and repository mapping coverage with explicit gaps.
          scenarios:
            - given: ten eligible source files and eight mapped paths
              when: mapping coverage is calculated
              then: Tieline must report 80 percent coverage and name both unmapped files
            - given: configured source roots contain no eligible files
              when: mapping coverage is calculated
              then: Tieline must report that coverage is not measured instead of reporting 100 percent
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/manifest.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/coverage.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/contract.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-contract.ts
                framework_hint: custom-script
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-manifest.ts
                framework_hint: custom-script
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-contract-command.ts
                framework_hint: custom-script
        - key: CONTRACT-001-AC3
          criterion: Tieline must report affected Acceptance Criteria and freshness for changed, renamed, or deleted linked paths without blocking on semantic findings.
          rationale: Drift should be visible during review while the MVP remains warn-only.
          scenarios:
            - given: a linked implementation path changes without a refreshed manifest
              when: the branch is checked against its base
              then: Tieline must report the linked criterion as impacted and stale
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/impact.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/check.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-impact.ts
                framework_hint: custom-script
        - key: CONTRACT-001-AC4
          criterion: Tieline must render accepted Stories and Acceptance Criteria as a self-contained human-readable review page.
          rationale: Maintainers outside the implementation can review the same repository-owned contract accepted by the pull request.
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/review-page.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/contract.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-contract-command.ts
                framework_hint: custom-script
        - key: CONTRACT-001-AC5
          criterion: Tieline must exit non-zero when the check runs in strict mode and the committed manifest does not match the compiled manifest.
          rationale: An agent-managed contract needs a machine-checkable gate because no human verifies the warn-only output, so a stale manifest merges unnoticed unless the command fails.
          scenarios:
            - given: the committed manifest does not match the compiled manifest
              when: the branch is checked against its base in strict mode
              then: Tieline must exit non-zero and name the stale manifest
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/check.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-impact.ts
                framework_hint: custom-script
        - key: CONTRACT-001-AC6
          criterion: The check report must label affected Acceptance Criteria as impact rather than as warnings, and must reserve warnings for findings that require an action.
          rationale: Impacts answer which behavior a change touches, which is orientation rather than a defect. Labelling orientation as a warning trains every reader to skip the stream, so the warnings that do require an action stop being read.
          scenarios:
            - given: a change modifies linked paths while the committed manifest is stale
              when: the branch is checked against its base
              then: affected Acceptance Criteria must be reported as impact and exactly one warning must name the stale manifest
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/check.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-impact.ts
                framework_hint: custom-script
    - key: CONTRACT-002
      title: Learn which acceptance criteria govern a path before editing it
      actor: implementing agent
      goal: resolve a repository path to the accepted behavior that already governs it
      benefit: a contradiction with accepted behavior is prevented instead of reported afterwards
      lifecycle: production
      aliases:
        - what contract governs this file
        - path to acceptance criterion lookup
      acceptance_criteria:
        - key: CONTRACT-002-AC1
          criterion: Tieline must report every acceptance criterion that links a repository-relative path, must distinguish a link carried by the acceptance criterion itself from one carried only by its Story, and must state explicitly when no acceptance criterion governs the path.
          rationale: Coverage answers for the whole contract and check answers for a diff, so both describe a violation that already exists; the pre-change question is the only one that can prevent it. An empty array reads to an agent like a failed query rather than the finding that the code is ungoverned.
          scenarios:
            - given: a path is linked by one acceptance criterion and by the Story that owns it
              when: the governing criteria for that path are requested
              then: Tieline must return both records and mark them direct and story_fallback
            - given: a path exists in the repository and no contract link targets it
              when: the governing criteria for that path are requested
              then: Tieline must state that no acceptance criterion governs it instead of returning an empty result
            - given: a requested path does not exist in the repository
              when: the governing criteria for that path are requested
              then: Tieline must report it distinctly from a path that exists but is ungoverned
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/contract/governs.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/commands/contract.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/cli.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-governs.ts
                framework_hint: custom-script
        - key: CONTRACT-002-AC2
          criterion: The governing-criteria lookup must answer from the compiled manifest alone, so Tieline must serve it over MCP with no database connection and must return a named, actionable message when no workspace or no readable manifest is found.
          rationale: Every other MCP tool fails at call time without Postgres, so an offline server boots and answers nothing; a manifest-backed lookup is what makes serving without a database worth doing, and an obscure throw would waste the one answer the caller came for.
          scenarios:
            - given: no database connection is configured
              when: the governing criteria for a path are requested over MCP
              then: Tieline must return the governing acceptance criteria and the commit the manifest records
            - given: the server runs outside any Tieline workspace
              when: the governing criteria for a path are requested
              then: Tieline must name the missing workspace and the command that creates one
          links:
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/tools/governing-criteria.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/server.ts
            - relation: implements
              target:
                kind: code
                repository: tieline
                path: src/schemas.ts
            - relation: tests
              target:
                kind: test
                repository: tieline
                path: scripts/test-governs.ts
                framework_hint: custom-script
