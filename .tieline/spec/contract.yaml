              then: Tieline must keep the newer page
            - given: the bucket holds an image's key with other bytes, and the captures directory holds the bytes the catalog names
              when: the page is published
              then: Tieline must store the image again before publishing the page, rather than count it as already stored
            - given: a pull request's page shows main's image beside a screen whose image it changed
