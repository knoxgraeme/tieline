    - key: CONTRACT-002
      title: Learn which acceptance criteria apply to a path before editing it
      actor: implementing agent
      goal: resolve a repository path to the acceptance criteria already recorded for it
      benefit: a contradiction with accepted behavior is prevented instead of reported afterwards
      lifecycle: production
      aliases:
        - which acceptance criteria apply to this file
        - path to acceptance criterion lookup
      acceptance_criteria:
        - key: CONTRACT-002-AC1
          criterion: Tieline must report every acceptance criterion linked to an exact repository-relative path, must distinguish a link carried by the acceptance criterion itself from one carried only by its Story, and must return an explicit has_criteria, no_criteria, or not_found status for every requested path.
          rationale: Coverage answers for the whole contract and check answers for a diff, so both describe a violation that already exists; the pre-change question is the only one that can prevent it. An empty array reads to an agent like a failed query rather than the actionable finding that an existing path has no recorded acceptance criteria.
          scenarios:
            - given: a path is linked by one acceptance criterion and by the Story that owns it
              when: the contract criteria for that path are requested
              then: Tieline must return has_criteria with both records marked direct and story_fallback
            - given: a path exists in the repository and no contract link targets it
              when: the contract criteria for that path are requested
              then: Tieline must return no_criteria and state that no acceptance criteria apply instead of returning an empty result
            - given: a requested path does not exist in the repository
              when: the contract criteria for that path are requested
              then: Tieline must return not_found distinctly from an existing path with no criteria
          links:
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/contract/reconciliation.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/contract/path-criteria.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/commands/contract.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/cli.ts
            - relation: tests
              provenance: authored
              target:
                kind: test
                repository: tieline
                path: scripts/test-path-criteria.ts
                framework_hint: custom-script
        - key: CONTRACT-002-AC2
          criterion: The path-criteria lookup must answer from the compiled manifest alone, so Tieline must serve get_path_criteria over MCP with no database connection and must return a named, actionable message when no workspace or no readable manifest is found.
          rationale: Every other MCP tool fails at call time without Postgres, so an offline server boots and answers nothing; a manifest-backed lookup is what makes serving without a database worth doing, and an obscure throw would waste the one answer the caller came for.
          scenarios:
            - given: no database connection is configured
              when: the contract criteria for a path are requested over MCP
              then: Tieline must return the applicable acceptance criteria and the content-derived digest of the manifest that answered
            - given: the server runs outside any Tieline workspace
              when: the contract criteria for a path are requested
              then: Tieline must name the missing workspace and the command that creates one
          links:
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/tools/path-criteria.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/server.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/schemas.ts
            - relation: tests
              provenance: authored
              target:
                kind: test
                repository: tieline
                path: scripts/test-path-criteria.ts
                framework_hint: custom-script
