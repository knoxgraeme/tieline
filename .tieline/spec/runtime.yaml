      title: Initialize a portable Tieline workspace
      actor: maintainer
      goal: configure contract roots and private runtime credentials
      benefit: the repository remains shareable without committing secrets
      lifecycle: production
      acceptance_criteria:
        - key: RUNTIME-001-AC1
          criterion: Tieline must keep shared repository configuration portable while storing clone-local setup state and database credentials in a private external profile.
          links:
