version: 1
capability:
  key: MATCHING
  name: Semantic matching and consolidation
  description: Focused semantic documents and auditable suggestions help equivalent language converge.
  stories:
    - key: MATCHING-001
      title: Search before creating product or planning records
      actor: author
      goal: find equivalent Stories, Acceptance Criteria, work, and evidence
      benefit: alternate phrasing converges without deleting source history
      lifecycle: production
      aliases:
        - duplicate prevention
        - semantic consolidation
      acceptance_criteria:
        - key: MATCHING-001-AC1
          criterion: Tieline must derive separate semantic documents for Stories, Acceptance Criteria, Scenarios, Backlog Items, and sanitized Observations.
          rationale: Focused documents preserve specificity and avoid re-embedding unrelated criteria.
          links:
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/derived/embedding-documents.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/embeddings.ts
            - relation: enforces
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/adapters/postgres/vector.ts
            - relation: tests
              provenance: authored
              target:
                kind: test
                repository: tieline
                path: tests/unit/retrieval/test-embeddings.ts
                framework_hint: custom-script
        - key: MATCHING-001-AC2
          criterion: Tieline must apply retrieval metadata as narrowing filters before combining always-on full-text and identifier recall with optional vector, alias, artifact-overlap, and three-hop graph signals through reciprocal rank fusion.
          scenarios:
            - given: a caller supplies an Observation anchor with only a dismissed relationship to an Acceptance Criterion
              when: Tieline ranks the authorized semantic candidate set
              then: the dismissed relationship must contribute no graph proximity
            - given: no embedding provider is installed or reachable
              when: a caller searches with an authorized retrieval profile
              then: Tieline must return full-text or identifier matches with explicit signal features and match reasons
          links:
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/domain/semantic-search-store.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/adapters/postgres/semantic-repository.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/adapters/postgres/search-context.ts
            - relation: implements
              provenance: authored
              target:
                kind: code
                repository: tieline
                path: src/ranking.ts
            - relation: implements
              provenance: authored
